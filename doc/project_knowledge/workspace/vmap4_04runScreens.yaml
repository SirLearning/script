kind: workspace_module
id: vmap4_04runScreens
title: FastCall scan screens and CS_mp BAM QC
version: "1.0"
path: /data/home/tusr1/01projects/vmap4/04runScreens
purpose: >
  FastCall3 scan timing experiments, single-sample scan debug, and BAM
  post-processing QC (proper-pair relabel, TLEN histograms).

shared_assets:
  - path: all/vLib
    role: Read-only variant library for scan runs
  - path: /data/home/tusr1/01projects/vmap4/lib/TIGER_F3_20261028.jar
    role: Installed FastCall3 jar (Java 17). Default --tiger_jar. scan/scan2/scan3/scan4 write VCF on stdout; scan_iac writes indiCounts/*.iac.gz only. No MaDR. scan3 merge table (-p) accepts single-source lines, so a taxon can map to itself.
  - path: /data/home/tusr1/01projects/vmap4/lib/TIGER_F3_20261012.jar
    role: Previous default (superseded 2026-10-28). scan3 merge table rejects single-source lines (>= 2 sources required).
  - path: /data/home/tusr1/01projects/vmap4/00data/05taxaBamMap/final.{A,B,D,ALL}.taxaBamMap.txt
    role: Production map set (8288 taxa). Superset of all.* by ABD_0915, ABD_0938, D_0132; jobs all/rebuild use it automatically via --tbm_set final.
  - path: /data/home/tusr1/01projects/vmap4/00data/05taxaBamMap/fill3.{A,B,D,ALL}.taxaBamMap.txt
    role: Partial set for the three taxa filled on 2026-10-27 (2/2/3/3 rows); input for 19run_scan_iac_fill3.

runs:
  - folder: 07run_cs_mp2018_scan_debug
    summary: CS_mp_2018_8X single-sample FastCall3 scan_only (chr2)
    entry: workflow/Genetics/modules/local/genotype/calling/caller.nf
    params: {mod: scan_only, chr: 2, job: chr1}
    artefacts:
      - chr1/gen/VCF/chr002.vcf.gz
      - setup_taxaBamMap.sh
    nf_cmd_ref: doc/progress/ — 2026-06-21 CS_mp scan_only

  - folder: 08run_cs_mp2018_properflag
    summary: CS_mp_2018_8X BAM proper-pair relabel and TLEN QC scripts
    artefacts:
      - CS_mp_2018_8X.properflag.bam
      - relabel_proper_pair.py
      - run_properflag.sh
      - validate_mpileup.sh
      - tlen_qc/
    nf_cmd_ref: doc/progress/ — 2026-06-22 proper-pair relabel and TLEN QC

  - folder: 09run_scan2_chr36
    summary: Failed scan2 chr36 (2 Mb jar vs 5 Mb .iac; Nextflow cwd leaked to git/script)
    entry: workflow/Genetics/modules/local/genotype/calling/caller.nf
    params: {mod: scan2, chr: 36, job: all, tiger_jar: TIGER_dazheng.jar}
    artefacts:
      - /data/home/tusr1/01projects/vmap4/04runScreens/all/gen/VCF/chr036.vcf.gz
      - /data1/dazheng_tusr1/vmap4.VCF.v1/chr036.vcf.gz
    nf_cmd_ref: "doc/progress/2026-09-16.md — NF replay: scan2 chr36"

  - folder: 10run_scan2_chr36
    summary: scan2 chr36 with 5 Mb jar TIGER_F3_20260916.jar (18:30); stopped 19:28 for scan4
    entry: workflow/Genetics/modules/local/genotype/calling/caller.nf
    params: {mod: scan2, chr: 36, job: all, tiger_jar: TIGER_F3_20260916.jar}
    artefacts:
      - /data/home/tusr1/01projects/vmap4/04runScreens/all/gen/VCF/chr036.vcf.gz
      - /data1/dazheng_tusr1/vmap4.VCF.v1/chr036.vcf.gz
    nf_cmd_ref: "doc/progress/2026-09-16.md — NF replay: scan2 chr36 5Mb"

  - folder: 11run_scan4_chr36
    summary: scan4 chr36 (256-site windows) with TIGER_dazheng.jar; left running at 8-core parallel batch
    entry: workflow/Genetics/modules/local/genotype/calling/caller.nf
    params: {mod: scan4, chr: 36, job: all, tiger_jar: TIGER_dazheng.jar}
    artefacts:
      - /data/home/tusr1/01projects/vmap4/04runScreens/all/gen/VCF/chr036.vcf.gz
      - /data1/dazheng_tusr1/vmap4.VCF.v1/chr036.vcf.gz
    nf_cmd_ref: "doc/progress/2026-09-16.md — NF replay: scan4 chr36"

  - folder: 12run_scan4_15chr
    summary: scan4 15 chrs at 8 CPUs (D 5,6,11,12,17,18,23,24,29,30,35,41,42 + B 3,4); plus 11run chr36 = 16 concurrent
    entry: workflow/Genetics/modules/local/genotype/calling/caller.nf
    params: {mod: scan4, chr: '5|6|11|12|17|18|23|24|29|30|35|41|42|3|4', job: all, tiger_jar: TIGER_dazheng.jar}
    artefacts:
      - /data/home/tusr1/01projects/vmap4/04runScreens/all/gen/VCF
    nf_cmd_ref: "doc/progress/2026-09-16.md — NF replay: scan4 15chr"

  - folder: 13run_scan4_filter_compare
    summary: MiDR/MaDR prefix compare of stopped scan4 tmp VCFs vs data1 production
    artefacts:
      - run_compare.py
      - run_compare_all.sh
      - all16.vs_data1.summary.tsv
    nf_cmd_ref: "doc/progress/2026-09-16.md — NF replay: scan4 filter compare all16"

  - folder: 14run_scan4_madr_floor
    summary: New-jar scan4 chr36 first 5 Mb to confirm MaDR absolute-depth floor
    artefacts:
      - chr036.filter.vcf.gz
      - chr036.madr_floor.summary.tsv
    nf_cmd_ref: "doc/progress/2026-09-17.md — NF replay: scan4 madr floor chr36"

  - folder: 15run_scan_iac_final
    summary: scan_iac chr 0-44 from all/vLib, 120 threads, one chromosome at a time; IAC under final/
    entry: workflow/Genetics/modules/local/genotype/calling/caller.nf
    params: {mod: scan_iac, chr: '0-44', job: all, server: s243, tiger_jar: TIGER_F3_20260930.jar, cpus: 120}
    artefacts:
      - /data/home/tusr1/01projects/vmap4/04runScreens/final/indiCounts
      - /data/home/tusr1/01projects/vmap4/04runScreens/all/vLib
    nf_cmd_ref: "doc/progress/2026-09-30.md — NF replay: scan_iac final"

  - folder: 16run_scan_iac_final_rest
    summary: scan_iac remaining chromosomes after stopping 15run once chr8 Java finished; skips 1, 6, and 8
    entry: workflow/Genetics/modules/local/genotype/calling/caller.nf
    params: {mod: scan_iac, chr: '0|2-5|7|9-44', job: all, server: s243, tiger_jar: TIGER_F3_20260930.jar, cpus: 120}
    artefacts:
      - /data/home/tusr1/01projects/vmap4/04runScreens/final/indiCounts
      - /data/home/tusr1/01projects/vmap4/04runScreens/all/vLib
    nf_cmd_ref: "doc/progress/2026-10-02.md — NF replay: scan_iac rest"

  - folder: 17run_scan_iac_final_80x2
    summary: Two concurrent scan_iac jobs at 80 threads after the host freed up; reruns unfinished chromosomes including partial chr21
    entry: workflow/Genetics/modules/local/genotype/calling/caller.nf
    params: {mod: scan_iac, chr: '0|5|12|13|21-44', job: all, server: s243, tiger_jar: TIGER_F3_20260930.jar, cpus: 80, maxForks: 2}
    artefacts:
      - /data/home/tusr1/01projects/vmap4/04runScreens/final/indiCounts
      - /data/home/tusr1/01projects/vmap4/04runScreens/all/vLib
    nf_cmd_ref: "doc/progress/2026-10-10.md — NF replay: scan_iac 80x2"

  - folder: 18run_scan_iac_fill3_validate
    summary: scan_iac chr24 with a 4-taxon test map; proves IAC is per-sample independent of the taxa set (D_0001 MD5 matches final)
    entry: workflow/Genetics/modules/local/genotype/calling/caller.nf
    params: {mod: scan_iac, tbm_set: test4, chr: 24, job: all, server: s243, tiger_jar: TIGER_F3_20260930.jar, cpus: 8, memory: 64.GB}
    artefacts:
      - 18run_scan_iac_fill3_validate/gen/indiCounts/D_0001
      - 18run_scan_iac_fill3_validate/gen/indiCounts/{ABD_0915,ABD_0938,D_0132}
    nf_cmd_ref: "doc/progress/2026-10-27.md — NF replay: scan_iac fill validation chr24"

  - folder: 19run_scan_iac_fill3
    summary: scan_iac for the three taxa missing from all.* (ABD_0915, ABD_0938, D_0132) on 45 chromosomes; staged then merged into final/indiCounts
    entry: workflow/Genetics/modules/local/genotype/calling/caller.nf
    params: {mod: scan_iac, tbm_set: fill3, chr: '0-44', job: all, server: s243, tiger_jar: TIGER_F3_20260930.jar, cpus: 8, memory: 64.GB, maxForks: 8}
    artefacts:
      - 19run_scan_iac_fill3/gen/indiCounts
      - /data/home/tusr1/01projects/vmap4/04runScreens/final/indiCounts/ABD_0915
      - /data/home/tusr1/01projects/vmap4/04runScreens/final/indiCounts/ABD_0938
      - /data/home/tusr1/01projects/vmap4/04runScreens/final/indiCounts/D_0132
    nf_cmd_ref: "doc/progress/2026-10-27.md — NF replay: scan_iac fill 3 taxa 45 chr"

  - folder: 20run_scan3_tbm_check
    summary: Confirms scan3 on job all resolves to final.*; stops before tasks because --scan3_merge_map is required
    entry: workflow/Genetics/modules/local/genotype/calling/caller.nf
    params: {mod: scan3, chr: 44, job: all}
    nf_cmd_ref: "doc/progress/2026-10-27.md — NF replay: scan3 final map check"

  - folder: 21run_tbm_concat_check
    summary: Regression check that the default per-population concat path still runs after adding --tbm_set; not a production output
    entry: workflow/Genetics/modules/local/genotype/calling/caller.nf
    params: {mod: scan_iac, chr: 44, job: chr1, server: s243, tiger_jar: TIGER_F3_20260930.jar}
    artefacts:
      - /data/home/tusr1/01projects/vmap4/00data/05taxaBamMap/chr1.A.taxaBamMap.txt
      - /data/home/tusr1/01projects/vmap4/00data/05taxaBamMap/chr1.ALL.taxaBamMap.txt
    nf_cmd_ref: "doc/progress/2026-10-27.md — NF replay: default per-population concat regression"

  - folder: 22run_scan3_chr44_taxamerge
    summary: First scan3 run with the complete merge map (final.ALL.taxaMergeMap.txt) on the new default jar; emits all 6196 final taxa in one VCF
    entry: workflow/Genetics/modules/local/genotype/calling/caller.nf
    params: {mod: scan3, chr: 44, job: all, tiger_jar: TIGER_F3_20261028.jar, scan3_merge_map: src/resource/sample_combine/final.ALL.taxaMergeMap.txt}
    artefacts:
      - 22run_scan3_chr44_taxamerge/out/all/gen3/VCF/chr044.vcf.gz
      - 22run_scan3_chr44_taxamerge/out/all/gen3/indiCounts
      - 22run_scan3_chr44_taxamerge/out/all/gen3/scan3_44.log
    nf_cmd_ref: "doc/progress/2026-10-28.md — NF replay: scan3 chr44 taxaMergeMap"

  - folder: 23run_scan3_all_taxamerge
    summary: Production scan3 over all 45 chromosomes with the per-sub-genome taxaMergeMap set, 128 threads per chromosome
    entry: workflow/Genetics/modules/local/genotype/calling/caller.nf
    params: {mod: scan3, job: all, chr: '0-44', tiger_jar: TIGER_F3_20261028.jar, scan3_cpus: 128, scan3_merge_map: 00data/05taxaBamMap}
    artefacts:
      - 23run_scan3_all_taxamerge/out/all/gen3/VCF
      - 23run_scan3_all_taxamerge/out/all/gen3/indiCounts
    nf_cmd_ref: "doc/progress/2026-10-28.md — NF replay: scan3 all chromosomes (128 threads)"

  - folder: all
    role: Production-scale scan job assets (vLib, configs)

  - folder: rebuild
    role: Rebuild scan pipeline trials

other_folders:
  - 01blib_scan_time1
  - 02run
  - 03scan.step2
  - 05rerun.lib
  - 06run.32
