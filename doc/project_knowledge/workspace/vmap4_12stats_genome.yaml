kind: workspace_module
id: vmap4_12stats_genome
title: Genotype stats runs (successor of 10stats.genome)
version: "1.0"
path: /data/home/tusr1/01projects/vmap4/12stats.genome
purpose: >
  Successor stats module after 10stats.genome reached NN=99. Same science area
  (genotype stats / assess / LD / MAC / popdep partials). Numbered runs from 01.
  Highest run is 99run_*; new launches use successor 14stats.genome.
partial_task: mac_het_excess
default_job: test_plink
publish_base: /data1/dazheng_tusr1/vmap4.VCF.v1/test_plink/

runs:
  - folder: 01run_popdep_het_filter_fill_test_rare_only
    summary: Het-filter popdep JointGrid with fill marginals (fail fraction vs depth, fail on top)
    nf_cmd_ref: "doc/progress/2026-08-18.md — NF replay: popdep het-filter fill marginals"
    screen: popdep_het_fill
    entry_nf: workflow/Genetics/subworkflows/local/entry/partial_router.nf
    partial_task: mac_het_excess
    mod: test_rare_only
    het_source_mod: test_common_only
    job: test_plink
    params:
      mac_het_sweep: false
      mac_het_heatmap: false
      mac_het_popdep_scatter: true
      mac_het_retain_alpha: 1.0e-6
    publish_stats: /data1/dazheng_tusr1/vmap4.VCF.v1/test_plink/stats/test_rare_only/
    status: completed

  - folder: 02run_popdep_het_filter_finebin_test_rare_only
    summary: Het-filter popdep JointGrid fill bins 250x150; fail scatter last with higher alpha
    nf_cmd_ref: "doc/progress/2026-08-18.md — NF replay: popdep het-filter fine bins"
    screen: popdep_het_fine
    entry_nf: workflow/Genetics/subworkflows/local/entry/partial_router.nf
    partial_task: mac_het_excess
    mod: test_rare_only
    het_source_mod: test_common_only
    job: test_plink
    params:
      mac_het_sweep: false
      mac_het_heatmap: false
      mac_het_popdep_scatter: true
      mac_het_retain_alpha: 1.0e-6
    publish_stats: /data1/dazheng_tusr1/vmap4.VCF.v1/test_plink/stats/test_rare_only/
    status: completed

  - folder: 03run_popdep_het_filter_uniform_alpha_test_rare_only
    summary: Same 250x150 fill bins; scatter pass/fail share alpha 0.25 (fail still drawn last)
    nf_cmd_ref: "doc/progress/2026-08-18.md — NF replay: popdep het-filter uniform alpha"
    screen: popdep_het_ualpha
    entry_nf: workflow/Genetics/subworkflows/local/entry/partial_router.nf
    partial_task: mac_het_excess
    mod: test_rare_only
    het_source_mod: test_common_only
    job: test_plink
    params:
      mac_het_sweep: false
      mac_het_heatmap: false
      mac_het_popdep_scatter: true
      mac_het_retain_alpha: 1.0e-6
    publish_stats: /data1/dazheng_tusr1/vmap4.VCF.v1/test_plink/stats/test_rare_only/
    status: completed

