kind: workspace_registry
id: vmap4_root
title: vmap4 top-level task modules
version: "1.0"
root: /data/home/tusr1/01projects/vmap4

modules:
  - id: "00data"
    role: Frozen project inputs (BAM, refs, taxaBamMap)
    knowledge: domain/data_publish_tree.yaml

  - id: "04runScreens"
    role: FastCall scan / screen timing / CS_mp BAM QC runs
    knowledge: workspace/vmap4_04runScreens.yaml

  - id: "08stats.genome"
    role: Legacy stats partial runs (assess, LD, wheat, MAC, chr compare)
    status: historical
    knowledge: workspace/vmap4_08stats_genome.yaml
    note: New stats work uses 10stats.genome from NN=01.

  - id: "10stats.genome"
    role: Stats module through NN=99 (PopDep / genotype-stats test runs)
    status: full
    knowledge: workspace/vmap4_10stats_genome.yaml
    note: >
      Highest run is 99run_*. New stats work uses successor 12stats.genome.
      Do not add 100run_* here. Do not add runs to 08stats.genome.

  - id: "12stats.genome"
    role: Genotype-stats test runs through NN=99 (successor of 10stats.genome)
    status: full
    knowledge: workspace/vmap4_12stats_genome.yaml
    note: >
      Highest run is 99run_*. New stats work uses successor 14stats.genome.
      Distinct from 12depth (mosdepth reruns).

  - id: "14stats.genome"
    role: Current genotype-stats test runs (successor of 12stats.genome)
    knowledge: workspace/vmap4_14stats_genome.yaml
    note: >
      Default module for new stats launches (NN from 01). Same science area as
      12stats.genome. Distinct from 12depth (mosdepth reruns).

  - id: "11aneuploidy"
    role: Mosdepth aneuploidy benchmark + MAPQ bin cohort scan
    knowledge: workspace/vmap4_11aneuploidy.yaml

  - id: "05reliable.lib"
    role: Site MQ (abstract_mq_50_bams) and library QC

  - id: "03chr1Run"
    role: chr1-scale caller / production trials

  - id: "02runScreens"
    role: Early scan screen experiments

  - id: "06transfer.watkins"
    role: Watkins transfer pipeline work
    knowledge: workspace/vmap4_06transfer_watkins.yaml

  - id: "07germ.check"
    role: Germplasm check workflows

  - id: "09dbone.build"
    role: DBone database build (related project)
