kind: workspace_module
id: vmap4_16stats_genome
title: Genotype stats runs (successor of 14stats.genome)
version: "1.0"
path: /data/home/tusr1/01projects/vmap4/16stats.genome
purpose: >
  Successor stats module after 14stats.genome reached NN=99. Same science area
  (genotype stats / assess / LD / MAC / popdep partials, combine IBS replots).
  Numbered runs from 01.
default_job: test_plink
publish_base: /data1/dazheng_tusr1/vmap4.VCF.v1/test_plink/

runs:
  - folder: 01run_combine_ibs_hist_bins
    summary: >
      Replot combine IBS histogram bars with --hist_bins 160 (finer bars than
      the 99run defaults of 80 AABBDD / 60 by-ploidy); rewrites *.hist.png only
    nf_cmd_ref: "doc/progress/2026-10-27.md — NF replay: combine IBS hist finer bins"
    screen: combine_ibs_hist_bins_01
    entry_nf: workflow/Genetics/subworkflows/tmp/combine_ibs_hist_replot.nf
    mod: test_common_inter
    job: test_plink
    params:
      hist_bins: 160
    publish_stats: /data1/dazheng_tusr1/vmap4.VCF.v1/test_plink/stats/test_common_inter/
    status: completed

  - folder: 02run_combine_ibs_hist_allgroups
    summary: >
      Same histograms, now with every ploidy that has random pairs (AA and SS
      added; SS has no combine-name pairs and is drawn as the random reference
      with 10 bins). --hist_bins 160 for the other groups.
    nf_cmd_ref: "doc/progress/2026-10-27.md — NF replay: combine IBS hist all ploidy groups"
    screen: combine_ibs_hist_bins_02
    entry_nf: workflow/Genetics/subworkflows/tmp/combine_ibs_hist_replot.nf
    mod: test_common_inter
    job: test_plink
    params:
      hist_bins: 160
    publish_stats: /data1/dazheng_tusr1/vmap4.VCF.v1/test_plink/stats/test_common_inter/
    status: completed

  - folder: 03run_combine_ibs_hist_threshold
    summary: >
      Superseded by 05run: drew the IBS 0.99 line on every panel, including the
      PLINK IBS ones that are not a merge criterion.
    nf_cmd_ref: "doc/progress/2026-10-27.md — NF replay: combine IBS hist 0.99 threshold"
    screen: combine_ibs_hist_thr_03
    entry_nf: workflow/Genetics/subworkflows/tmp/combine_ibs_hist_replot.nf
    mod: test_common_inter
    job: test_plink
    params:
      hist_bins: 160
      ibs_threshold: 0.99
    publish_stats: /data1/dazheng_tusr1/vmap4.VCF.v1/test_plink/stats/test_common_inter/
    status: completed

  - folder: 04run_combine_ibs_merge_threshold
    summary: >
      Python extract (not Nextflow) listing combine groups whose internal pairs
      fail the merge criterion, resolved back to curated germplasm_id/name;
      writes combine_groups_not_merged.tsv and combine_pairs_not_merged.tsv.
      Metric is a flag (--metric, default hom_ibs); the plink_ibs pass is
      diagnostic only.
    cmd: >
      python -I extract_not_merged.py --pairs <publish>/info/all.sample.combine_ibs.pairs.tsv
      --combine src/resource/sample_combine/curation_germplasm_combine_name_groups.tsv
      --metric hom_ibs --outdir hom_ibs --threshold 0.99
    mod: test_common_inter
    job: test_plink
    source_published: /data1/dazheng_tusr1/vmap4.VCF.v1/test_plink/stats/test_common_inter/info/
    status: completed

  - folder: 05run_combine_ibs_hist_thr_homsnp
    summary: >
      Republish the histogram series with the IBS 0.99 dashed line on the
      hom-SNP panels only; the PLINK IBS panels are left unmarked because the
      merge criterion is hom_ibs.
    nf_cmd_ref: "doc/progress/2026-10-27.md — NF replay: combine IBS hist hom-SNP threshold"
    screen: combine_ibs_hist_thr_05
    entry_nf: workflow/Genetics/subworkflows/tmp/combine_ibs_hist_replot.nf
    mod: test_common_inter
    job: test_plink
    params:
      hist_bins: 160
      ibs_threshold: 0.99
    publish_stats: /data1/dazheng_tusr1/vmap4.VCF.v1/test_plink/stats/test_common_inter/
    status: completed

  - folder: 06run_combine_ibs_hist_two_lines
    summary: >
      Current histogram series: hom-SNP panels carry both cutoffs as dashed
      lines (0.99 and 0.995); PLINK IBS panels stay unmarked.
    nf_cmd_ref: "doc/progress/2026-10-27.md — NF replay: combine IBS hist two cutoffs"
    screen: combine_ibs_hist_two_06
    entry_nf: workflow/Genetics/subworkflows/tmp/combine_ibs_hist_replot.nf
    mod: test_common_inter
    job: test_plink
    params:
      hist_bins: 160
      ibs_thresholds: "0.99,0.995"
    publish_stats: /data1/dazheng_tusr1/vmap4.VCF.v1/test_plink/stats/test_common_inter/
    status: completed

  - folder: 07run_combine_ibs_pca
    summary: >
      First PCA pass (superseded by 09run): every combine pair drawn as an edge
      on the A/B/D/Others PCA of test_common_inter, red above the cohort
      hom-SNP IBS cutoff and blue below with endpoint labels. Axes still
      spanned the full PCA range, so the wired region collapsed into a corner.
    nf_cmd_ref: "doc/progress/2026-10-27.md — NF replay: combine IBS PCA"
    screen: combine_ibs_pca_07
    entry_nf: workflow/Genetics/subworkflows/tmp/combine_ibs_pca.nf
    mod: test_common_inter
    job: test_plink
    params:
      subgenomes: "A,B,D,Others"
      cutoffs: "all.sample.combine_ibs=0.995, all.sample.combine_ibs_ipk_hzau_watkins=0.99"
    publish_stats: /data1/dazheng_tusr1/vmap4.VCF.v1/test_plink/stats/test_common_inter/
    status: superseded

  - folder: 08run_combine_ibs_pca_zoom
    summary: >
      PCA pass 2 (superseded by 09run): cropped the axes to the min/max of the
      connected samples; one distant WAP group stretched the box again.
    screen: combine_ibs_pca_08
    entry_nf: workflow/Genetics/subworkflows/tmp/combine_ibs_pca.nf
    mod: test_common_inter
    job: test_plink
    publish_stats: /data1/dazheng_tusr1/vmap4.VCF.v1/test_plink/stats/test_common_inter/
    status: superseded

  - folder: 09run_combine_ibs_pca_pct
    summary: >
      Current PCA series: axes cropped to the 1st-99th percentile of the
      connected samples, so the combine-group structure fills the figure in all
      eight panels (two cohorts x A/B/D/Others). Dense clusters still stack
      labels where many failing pairs sit together.
    nf_cmd_ref: "doc/progress/2026-10-27.md — NF replay: combine IBS PCA"
    screen: combine_ibs_pca_09
    entry_nf: workflow/Genetics/subworkflows/tmp/combine_ibs_pca.nf
    mod: test_common_inter
    job: test_plink
    params:
      subgenomes: "A,B,D,Others"
      cutoffs: "all.sample.combine_ibs=0.995, all.sample.combine_ibs_ipk_hzau_watkins=0.99"
    publish_stats: /data1/dazheng_tusr1/vmap4.VCF.v1/test_plink/stats/test_common_inter/
    status: completed

  - folder: 10run_combine_ibs_pca_ld
    summary: >
      LD-pruned PCA series: reuses the pipeline's pca_ld eigenvecs
      (--indep-pairwise 50 5 0.2, --pca approx 10) for A/B/D and redraws the
      combine-group wiring as *_pca_ld.<sg>.png. Others is skipped: its 104k
      variants prune down to 24, below the 22-per-PC minimum, and the pipeline
      excludes Others from its own LD-PCA path for the same reason.
    nf_cmd_ref: "doc/progress/2026-10-27.md — NF replay: combine IBS PCA LD-pruned"
    screen: combine_ibs_pca_ld_10
    entry_nf: workflow/Genetics/subworkflows/tmp/combine_ibs_pca_ld.nf
    mod: test_common_inter
    job: test_plink
    params:
      subgenomes: "A,B,D"
      cutoffs: "all.sample.combine_ibs=0.995, all.sample.combine_ibs_ipk_hzau_watkins=0.99"
    publish_stats: /data1/dazheng_tusr1/vmap4.VCF.v1/test_plink/stats/test_common_inter/
    publish_process: /data1/dazheng_tusr1/vmap4.VCF.v1/test_plink/process/test_common_inter/pca_ld/
    status: completed

  - folder: 11run_combine_ibs_ploidy_pca
    summary: >
      Superseded by 12run: per-ploidy genome-wide PCA. All four ploidy tasks
      failed because the --keep file had two columns (FID IID) while the merged
      psam carries IID only, leaving 0 samples.
    screen: combine_ibs_ploidy_11
    entry_nf: workflow/Genetics/subworkflows/tmp/combine_ibs_ploidy_pca.nf
    mod: test_common_inter
    job: test_plink
    status: failed

  - folder: 12run_combine_ibs_ploidy_pca_fix
    summary: >
      Per-ploidy PCA over the whole genome (no subgenome split): merges the 44
      chr*.common.inter pfiles, then for each of AA/AABB/AABBDD/DD subsets the
      samples, LD-prunes (maf 0.05, indep-pairwise 50 5 0.2) and runs
      --pca approx 10; combine wiring drawn as *.pca_ploidy.<ploidy>.png.
      AABBDD remains label-dense (834 pairs over 7125 samples).
    nf_cmd_ref: "doc/progress/2026-10-27.md — NF replay: combine IBS ploidy PCA"
    screen: combine_ibs_ploidy_12
    entry_nf: workflow/Genetics/subworkflows/tmp/combine_ibs_ploidy_pca.nf
    mod: test_common_inter
    job: test_plink
    params:
      ploidies: "AA,AABB,AABBDD,DD"
      cutoffs: "all.sample.combine_ibs=0.995, all.sample.combine_ibs_ipk_hzau_watkins=0.99"
    publish_stats: /data1/dazheng_tusr1/vmap4.VCF.v1/test_plink/stats/test_common_inter/
    status: completed

  - folder: 13run_combine_ibs_ploidy_pca_skip
    summary: >
      Superseded by 15run. Added the "no pairs in this population" skip (a
      single-ploidy cohort such as IPK/HZAU/Watkins produced empty AA/AABB/DD
      panels). The view was still cropped to the connected samples, which hid
      92 of the 96 AA samples.
    screen: combine_ibs_ploidy_13
    entry_nf: workflow/Genetics/subworkflows/tmp/combine_ibs_ploidy_pca.nf
    mod: test_common_inter
    job: test_plink
    status: superseded

  - folder: 15run_combine_ibs_ploidy_pca_nominal
    summary: >
      Current ploidy PCA series. Cropping now uses the 1st-99th percentile band
      of the whole population instead of the few connected samples, and groups
      follow nominal_ploidy (--ploidy_column nominal_ploidy) so the WAP P####
      hexaploids no longer appear in the AABB panel. AA is skipped by the
      no-pairs rule: all 91 A_ samples sit in singleton combine rows, so no AA
      pair exists; the 2 pairs previously drawn there came from AB_ accessions
      whose measured ploidy is AA.
    nf_cmd_ref: "doc/progress/2026-10-27.md — NF replay: combine IBS ploidy PCA"
    screen: combine_ibs_ploidy_15
    entry_nf: workflow/Genetics/subworkflows/tmp/combine_ibs_ploidy_pca.nf
    mod: test_common_inter
    job: test_plink
    params:
      ploidies: "AA,AABB,AABBDD,DD"
      ploidy_column: "nominal_ploidy"
      cutoffs: "all.sample.combine_ibs=0.995, all.sample.combine_ibs_ipk_hzau_watkins=0.99"
    publish_stats: /data1/dazheng_tusr1/vmap4.VCF.v1/test_plink/stats/test_common_inter/
    status: completed

  - folder: 16run_combine_ibs_ploidy_pca_full
    summary: >
      Current ploidy PCA series: a population with no combine pairs is still
      drawn (points only) instead of being skipped, and each cohort carries its
      own panel list so IPK/HZAU/Watkins emits AABBDD alone. Outputs five
      figures: WAP AA/AABB/AABBDD/DD plus IPK AABBDD. The AA panel is 91 grey
      points with no edges because every A_ accession sits in a singleton
      combine row.
    nf_cmd_ref: "doc/progress/2026-10-27.md — NF replay: combine IBS ploidy PCA"
    screen: combine_ibs_ploidy_16
    entry_nf: workflow/Genetics/subworkflows/tmp/combine_ibs_ploidy_pca.nf
    mod: test_common_inter
    job: test_plink
    params:
      ploidies: "AA,AABB,AABBDD,DD"
      ploidy_column: "nominal_ploidy"
      cutoffs: "all.sample.combine_ibs=0.995, all.sample.combine_ibs_ipk_hzau_watkins=0.99"
    publish_stats: /data1/dazheng_tusr1/vmap4.VCF.v1/test_plink/stats/test_common_inter/
    status: completed

  - folder: 17run_pca_ibs_pc_association
    summary: >
      Analysis (not Nextflow): per-PC absolute distance vs hom-SNP IBS for the
      4783 IPK/HZAU/Watkins pairs against 200k random AABBDD pairs, plus
      cumulative PC1..k Euclidean distances and a range-matched random baseline
      (IBS >= 0.9787, n=31,731). Across the full range PC1 dominates (rho -0.49);
      inside the near-duplicate range no single PC leads and the combine pairs
      show |rho| <= 0.15. Writes pca_ibs_pc_association.tsv to the run folder.
    cmd: >
      python -I pca_ibs_association.py
      --eigenvec <publish>/process/test_common_inter/pca_ploidy/AABBDD.pca.eigenvec
      --pairs <publish>/stats/test_common_inter/info/all.sample.combine_ibs_ipk_hzau_watkins.pairs.tsv
      --random <publish>/stats/test_common_inter/info/all.sample.identity.ploidy_group_ibs.pairs.tsv
      --outdir .
    mod: test_common_inter
    job: test_plink
    status: completed

  - folder: 35run_selfing_filtered_ibs
    summary: >
      hom-SNP IBS on PopDep keep80 plus the pipeline's selfing-model het filter
      (p_excess from Binomial(MAC, (1-F)(1-MAC/2N)); median F A 0.860 / B 0.836 /
      D 0.719; 60-65% of sites survive). Computed for 878 combine pairs and 2000
      random AABBDD pairs on full and filtered sites. Median IBS full → filtered:
      combine 0.99864 → 0.99933, random 0.97412 → 0.97014, so the gap widens
      (0.0245 → 0.0292) rather than collapsing. Supersedes the HWE-based attempt
      in 34run, which was the wrong null for a selfing species.
    cmd: >
      python -I selfing_filtered_ibs.py --src-dir <repo>/src
      --process-dir <publish>/process/test_common_inter
      --het-dir <publish>/process/test_common_only/sample
      --popdep-dir <publish>/process/_popdep_n500_cv_reliable
      --pairs <info>/all.sample.combine_ibs.pairs.tsv
      --random <info>/all.sample.identity.ploidy_group_ibs.pairs.tsv --outdir full
    mod: test_common_inter
    job: test_plink
    status: completed

  - folder: 38run_publish_selfing_hist_fix2
    summary: >
      Published the combine-vs-random IBS comparison figures for the selfing
      filtered set through the new tmp entry publish_ibs_hist.nf:
      all.sample.combine_ibs.vs_random.{all_sites,filtered}.hist.png.
    screen: publish_selfing_38
    entry_nf: workflow/Genetics/subworkflows/tmp/publish_ibs_hist.nf
    mod: test_common_inter
    job: test_plink
    publish_stats: /data1/dazheng_tusr1/vmap4.VCF.v1/test_plink/stats/test_common_inter/
    status: completed

  - folder: 31run_hom_ibs_site_counts
    summary: >
      Analysis (not Nextflow): counts the sites the hom-SNP IBS is actually built
      from, by decoding the PLINK beds directly (the published pair tables carry
      n_hom = 0). Median both-homozygous sites per pair on test_common_inter: A
      574,818 / B 1,204,920 / D 208,798 (~2.0M genome-wide), so a 0.995 cutoff
      tolerates ~10,000 homozygous-homozygous mismatches; the closest pairs show
      11-28. Use it to price a cutoff in "sites that would flip hom->het".
    cmd: >
      python -I hom_ibs_site_counts.py --process-dir <publish>/process/test_common_inter
      --pairs <publish>/stats/test_common_inter/info/all.sample.combine_ibs.pairs.tsv
      --subgenome D --n-pairs 8 --outdir .
    mod: test_common_inter
    job: test_plink
    status: completed

  - folder: 30run_test_thin_combine_ibs
    summary: >
      Combine IBS validation run on the test_thin variant set (its ibs/ and
      ibs_hom_snp/ matrices date from 2026-09-06, reused as-is), twice: PLINK IBS
      (prefix all.sample.combine_ibs) and hom-SNP IBS (all.sample.combine_ibs.homsnp,
      tiers 0.983/0.995). Outputs land in stats/test_thin/{info,plots}. Headline:
      the separation rate is stable (78% of combine pairs above the random p95,
      vs 79% on test_common_inter) but the margin shrinks ~3x and the random
      baseline rises — 71.7% of random AABBDD pairs clear hom_ibs 0.99 on thin
      vs 0.2% on test_common_inter, so the merge cutoff does not transfer
      between variant sets.
    nf_cmd_ref: "doc/progress/2026-10-28.md — NF replay: test_thin combine IBS"
    screen: test_thin_ibs_30
    entry_nf: workflow/Genetics/subworkflows/tmp/combine_ibs_validate.nf
    mod: test_thin
    job: test_plink
    status: completed

  - folder: 29run_lowcov_fail_groups
    summary: >
      Analysis (not Nextflow): how much of the failing-group list is explained by
      taxaBamMap coverage < 2x (coverage taken from the pair table's
      coverage1/coverage2). WAP_PQ/VMap3: 1 of 228 failing groups contains such a
      sample (PH 82-2-2, P0255 at 0.42x) and it passes once that pair is removed;
      five groups (Redna, Sudani, Tucursindi, KU-2013, BW23924) have no coverage
      value at all. IPK/HZAU/Watkins: all 5 failing groups contain low-coverage
      samples (min 0.08-1.94x) and all 5 pass once those pairs are set aside.
    cmd: >
      python -I lowcov_fail_groups.py --pairs <publish>/stats/test_common_inter/info/<prefix>.pairs.tsv
      --groups src/resource/sample_combine/combine_groups_not_merged_hom_ibs.tsv
      --threshold 0.995 --label wap_vmap3 --outdir .
    mod: test_common_inter
    job: test_plink
    status: completed

  - folder: 28run_combine_ibs_edge_distance_hist
    summary: >
      Published grouped-bar histograms of PCoA edge length, pass vs fail, in the
      same style as the by-ploidy IBS histograms (plot_grouped_histogram,
      side-by-side bars, dpi 300). Four figures: *_pcoa_edge_distance.{AABB,
      AABBDD,DD}.hist.png for WAP_PQ/VMap3 plus IPK/HZAU/Watkins AABBDD; AA is
      skipped because it has no pairs.
    nf_cmd_ref: "doc/progress/2026-10-27.md — NF replay: PCoA edge distance hist"
    screen: combine_ibs_edge_hist_28
    entry_nf: workflow/Genetics/subworkflows/tmp/combine_ibs_edge_distance_hist.nf
    mod: test_common_inter
    job: test_plink
    params:
      ploidies: "AA,AABB,AABBDD,DD"
    publish_stats: /data1/dazheng_tusr1/vmap4.VCF.v1/test_plink/stats/test_common_inter/
    status: completed

  - folder: 27run_pcoa_edge_lengths
    summary: >
      Analysis (not Nextflow): Euclidean length of every combine edge in PCoA
      space (PC1-PC2 and PC1-PC10), split by pass/fail. WAP_PQ/VMap3 AABBDD is
      the only group with enough failing pairs to test: median 0.0114 vs 0.0024
      (4.7x, KS 0.82, Cliff's delta 0.92, Mann-Whitney p~1e-111). IPK/HZAU/
      Watkins has 5 failing pairs whose lengths sit inside the passing bulk
      (2.3x median, p=0.036), and AABB/DD have 1-2 failing pairs, too few to
      test.
    cmd: >
      python -I pcoa_edge_lengths.py --pcoa-dir <publish>/process/test_common_inter/pcoa_ibs
      --info-dir <publish>/stats/test_common_inter/info --outdir .
    mod: test_common_inter
    job: test_plink
    status: completed

  - folder: 24run_combine_ibs_ploidy_plot_split
    summary: >
      Superseded by 26run: first attempt at the pass/fail split for the variant
      PCA series; emitted no figures because the cohort filter indexed
      item[3] (the threshold) instead of item[4] (the allowed-ploidy list) and
      nothing passed it.
    screen: combine_ibs_split_24
    entry_nf: workflow/Genetics/subworkflows/tmp/combine_ibs_ploidy_pca_plot.nf
    mod: test_common_inter
    job: test_plink
    status: failed

  - folder: 25run_combine_ibs_pcoa_plot_split
    summary: >
      PCoA series split into combined / pass-only / fail-only figures: 8 PNGs
      (*.pcoa.{pass,fail}.{AABB,AABBDD,DD}.png for WAP plus IPK AABBDD). The
      split figures carry no sample labels; AA emits none because its pairs are
      all singletons.
    nf_cmd_ref: "doc/progress/2026-10-27.md — NF replay: combine IBS pass/fail split"
    screen: combine_ibs_split_25
    entry_nf: workflow/Genetics/subworkflows/tmp/combine_ibs_pcoa_plot.nf
    mod: test_common_inter
    job: test_plink
    params:
      pcoa_dir: "16stats.genome/21run_ibs_pcoa_groups"
      ploidies: "AA,AABB,AABBDD,DD"
    publish_stats: /data1/dazheng_tusr1/vmap4.VCF.v1/test_plink/stats/test_common_inter/
    status: completed

  - folder: 26run_combine_ibs_ploidy_plot_split_fix
    summary: >
      Variant PCA series split the same way, plotting straight from the
      published pca_ploidy eigenvectors via the new plot-only entry
      combine_ibs_ploidy_pca_plot.nf (no PCA recompute): 8 PNGs
      (*.pca_ploidy.{pass,fail}.{AABB,AABBDD,DD}.png for WAP plus IPK AABBDD).
    nf_cmd_ref: "doc/progress/2026-10-27.md — NF replay: combine IBS pass/fail split"
    screen: combine_ibs_split_26
    entry_nf: workflow/Genetics/subworkflows/tmp/combine_ibs_ploidy_pca_plot.nf
    mod: test_common_inter
    job: test_plink
    params:
      ploidies: "AA,AABB,AABBDD,DD"
    publish_stats: /data1/dazheng_tusr1/vmap4.VCF.v1/test_plink/stats/test_common_inter/
    status: completed

  - folder: 21run_ibs_pcoa_groups
    summary: >
      Analysis (not Nextflow): one PCoA per ploidy group, each built from the
      subgenome matrices that group carries (AA -> A, AABB -> A+B, AABBDD ->
      A+B+D, DD -> D) with nominal_ploidy membership. Parses the three matrices
      once and reuses them. PC1 explains 93.0% (AA), 40.1% (AABB), 29.7%
      (AABBDD, matches 19run), 95.2% (DD); the AABBDD solve takes ~150 s.
    cmd: >
      python -I ibs_pcoa_groups.py --mibs-dir <publish>/process/test_common_inter/ibs_hom_snp
      --samples <publish>/stats/test_common_inter/info/all.sample.identity.ploidy_group_ibs.samples.tsv
      --groups AA,AABB,AABBDD,DD --outdir .
    mod: test_common_inter
    job: test_plink
    status: completed

  - folder: 23run_combine_ibs_pcoa_groups_plot_fix
    summary: >
      Current PCoA wiring series: WAP AA/AABB/AABBDD/DD plus IPK AABBDD, drawn
      from the four 21run coordinate tables; the tables are published to
      process/<mod>/pcoa_ibs/. 22run produced no panels because the cohort
      filter indexed the wrong tuple fields after the published channel grew a
      group element.
    nf_cmd_ref: "doc/progress/2026-10-27.md — NF replay: combine IBS PCoA plot"
    screen: combine_ibs_pcoa_23
    entry_nf: workflow/Genetics/subworkflows/tmp/combine_ibs_pcoa_plot.nf
    mod: test_common_inter
    job: test_plink
    params:
      pcoa_dir: "16stats.genome/21run_ibs_pcoa_groups"
      ploidies: "AA,AABB,AABBDD,DD"
